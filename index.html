<html lang="es">
<head>
<meta charset="utf-8" />
<title>Calendario de Adviento 2025</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: "Courier New", monospace;
    padding: 0;
  }

  /* Intro */
  #intro {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
  }
  #intro h1 {
    font-size: 28px;
    margin-bottom: 20px;
    font-weight: 300;
  }
  #intro p {
    font-size: 18px;
  }
  .cursor {
    display: inline-block;
    width: 10px;
    background: #fff;
    margin-left: 4px;
    animation: blink 0.8s infinite;
    vertical-align: middle;
    height: 22px;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* Loading */
  #loading {
    position: fixed;
    inset: 0;
    background: #000;
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
  }
  #loading p {
    margin-bottom: 20px;
    font-size: 20px;
  }
  .loading-box {
    width: 350px;
    height: 35px;
    display: flex;
    gap: 2px;
    border: 2px solid #fff;
    padding: 2px;
    box-sizing: border-box;
    overflow: hidden;
  }
  .segment {
    flex: 1;
    background: #000;
    border: 1px solid #fff;
    transition: background 0.2s;
  }
  .loading-box.fill .segment {
    animation: fillSegment 0.3s forwards;
  }
  .loading-box.fill .segment:nth-child(1)  { animation-delay: 0s; }
  .loading-box.fill .segment:nth-child(2)  { animation-delay: 0.15s; }
  .loading-box.fill .segment:nth-child(3)  { animation-delay: 0.3s; }
  .loading-box.fill .segment:nth-child(4)  { animation-delay: 0.45s; }
  .loading-box.fill .segment:nth-child(5)  { animation-delay: 0.6s; }
  .loading-box.fill .segment:nth-child(6)  { animation-delay: 0.75s; }
  .loading-box.fill .segment:nth-child(7)  { animation-delay: 0.9s; }
  .loading-box.fill .segment:nth-child(8)  { animation-delay: 1.05s; }
  .loading-box.fill .segment:nth-child(9)  { animation-delay: 1.2s; }
  .loading-box.fill .segment:nth-child(10) { animation-delay: 1.35s; }
  .loading-box.fill .segment:nth-child(11) { animation-delay: 1.5s; }
  .loading-box.fill .segment:nth-child(12) { animation-delay: 1.65s; }
  .loading-box.fill .segment:nth-child(13) { animation-delay: 1.8s; }
  .loading-box.fill .segment:nth-child(14) { animation-delay: 1.95s; }
  .loading-box.fill .segment:nth-child(15) { animation-delay: 2.1s; }
  .loading-box.fill .segment:nth-child(16) { animation-delay: 2.25s; }
  .loading-box.fill .segment:nth-child(17) { animation-delay: 2.4s; }
  .loading-box.fill .segment:nth-child(18) { animation-delay: 2.55s; }
  .loading-box.fill .segment:nth-child(19) { animation-delay: 2.7s; }
  .loading-box.fill .segment:nth-child(20) { animation-delay: 2.85s; }

  @keyframes fillSegment {
    0% { background: #000; }
    100% { background: #fff; }
  }

  /* Calendar */
  .calendar {
    display: none;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    max-width: 600px;
    margin: 40px auto;
  }
  @media (max-width: 720px) { .calendar { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 480px) { .calendar { grid-template-columns: repeat(2, 1fr); } }

  .door { perspective: 600px; }
  .day {
    width: 100%;
    padding-top: 100%;
    position: relative;
    border: 1px dashed #fff;
    cursor: pointer;
    color: #fff;
    transform-origin: left center;
    transition: transform 0.6s ease;
    backface-visibility: hidden;
  }
  .day span { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 24px; }
  .day.locked { cursor: pointer; }
  .day.open { transform: rotateY(-120deg); }

  /* Modal */
  #modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    display: none;
    padding: 40px;
    overflow-y: auto;
  }
  #modalContent {
    width: 90%;
    max-width: 600px;
    margin: 0 auto;
    white-space: normal;
    font-family: "Courier New", monospace;
    color: #fff;
    text-align: justify;
    word-wrap: break-word;
  }
  #modalContent img, 
  #modalContent video, 
  #modalContent iframe {
    max-width: 100%;
    height: auto;
    display: block;
    margin: 20px 0;
  }
  .close {
    display: block;
    margin: 60px auto 0;
    padding: 10px 20px;
    border: 1px dashed #fff;
    cursor: pointer;
    width: fit-content;
    text-align: center;
    text-decoration: none;
  }
</style>
</head>

<p>Desde 2003, la artista catalana Isabel Banal empezó a recortar y guardar todas las figuras cargadas que encontraba en fotografías de periódicos y revistas. Las hojeaba, las arrancaba con cuidado y las iba pegando sobre páginas en blanco de un bloc de notas. Creo que era una forma de pensar sobre la idea de carga, de pensar sobre el hecho de que siempre transportamos algo de un lugar a otro, que no dejamos de trajinar, de mover el peso; el peso visible, el peso invisible.</p> 
<p>Mujeres que iban a por agua, mujeres que transportaban gallinas, mujeres que llevaban la cosecha recogida en sus faldas. Una cesta, un cuévano, un cubo, una canasta, unas cazuelas con cocido, una caja de fruta, un bidón de agua, un carrito de la compra. El pan, la piedra.</p> 
<p>A lo largo de la historia han sido mujeres anónimas quienes día a día se han encargado de alimentar a otros, de sostener el cuidado de toda la familia. Cargar para nutrir, para proteger, para cuidar.</p> 
<p>Pienso en imágenes que vemos por la calle: mujeres cargando bolsas de la compra, mujeres cargando garrafas, mujeres empujando un carrito, mujeres cargando en brazos a un niño pequeño. Esta es la condición histórica de la mujer.</p> 
<p>Pienso en la abuela llevando al abuelo del brazo, pienso en las fotos de mamá empujando el carrito con Elsa dentro y yo subida detrás mientras llevaba a Ana de apenas unos meses en la mochila, pienso en mujeres cargando mujeres que cargan mujeres que cargan mujeres. Pienso en todo lo que llevamos encima. Y en que, al final, las cosas pesan menos cuando el peso se reparte.</p>

16: `
<p>El otro día en el metro escuchaba un podcast que explicaba que hace unos años saltaron las alarmas porque hay niños que han dejado de jugar para ver cómo otros niños juegan. En YouTube son los llamados “niños <em>unboxers</em>”. Las cifras hablan por sí solas: “Ryan Pretend Play &#119;&#105;&#116;&#104; McDonalds Toys and cook toys food!”, 167 millones de reproducciones, “Diana and Roma play with Barbie Toys from Barbie Princess Adventure”, 267 millones de reproducciones, “Diana and her barbie car”, 2 billones de reproducciones. ¿Sirve esto también como descripción de nuestras horas en Internet?</p>

<p>Mirando a mi alrededor todos los pasajeros sostenían un móvil entre las manos. De fondo sonaba la música del <em>Candy Crush</em>. A mi izquierda una señora hacía <em>scroll</em> infinito en <em>TikTok</em> sin que su expresión cambiara lo más mínimo: vídeos de <em>tradwives</em> cocinando pasteles, perfectamente metidas en la representación más heteronormativa de la maternidad. A mi derecha, un chico miraba uno de esos <em>reels</em> diseñados para que el principio y el final encajen perfectamente, creando un <em>loop</em> sin fin. Llevaba varios minutos viendo el mismo vídeo, al darse cuenta pasó a las <em>stories</em>.</p>

<p>Pienso en las <em>stories</em> que consumimos a diario. Viajes de amigas, conciertos, fiestas, excursiones, puestas de sol. Influencers compartiendo el café de la mañana, la rutina de <em>skincare</em>, su pedida de matrimonio, la primera ecografía de su embarazo. Y entre todo esto, también aparecen las imágenes de la guerra en Gaza, de inmigrantes ahogados, de Valencia sacudida por la DANA.</p>

<p>Pienso en el acto de hacerse una foto en el espejo con la cámara del móvil, como un espejo frente a un espejo. Esto me lleva a “La cámara lúcida”, donde Roland Barthes reflexiona sobre la fotografía:</p>

<blockquote style="margin-left: 40px; color: #ccc;">
Observé que una foto puede ser objeto de tres prácticas (o de tres emociones, o de tres intenciones): hacer, experimentar, mirar. El <em>Operator</em> es el Fotógrafo. <em>Spectator</em> somos los que compulsamos en los periódicos, libros, álbumes o archivos, colecciones de fotos. Y aquel o aquello que es fotografiado es el blanco, el referente, una especie de pequeño simulacro, de <em>eidôlon</em> emitido por el objeto, que yo llamaría de buen grado el <em>Spectrum</em> de la Fotografía porque esta palabra mantiene a través de su raíz una relación con «espectáculo» y le añade ese algo terrible que hay en toda fotografía: el retorno de lo muerto.
</blockquote>

<p>Barthes habla del fotógrafo y la relación con el “agujerito” (<em>sténopé</em>) a través del cual mira, encuadra y captura. ¿No son nuestros móviles ese mismo agujerito, una ventana abierta a la vida de otras personas, como una mirilla desde la que observar al vecino de al lado?</p>

<p>Barthes también se detiene en el sujeto mirado y mirante. Cuando nos sentimos observados por el objetivo todo cambia: nos constituimos en el acto de posar, nos fabricamos instantáneamente otro cuerpo, nos transformamos por adelantado en imagen. Se abre una brecha entre lo que somos y aquello que aparece en la fotografía. ¿Pueden coincidir ambas cosas? ¿Cuántas lecturas posibles caben en un solo rostro?</p>

<p>Frente a este juego social permanente, Barthes define la vida privada como el último refugio: ese espacio y ese tiempo en los que no somos una imagen, en los que no somos un objeto. Defender la vida privada es, para él, un derecho político fundamental: el derecho a seguir siendo sujeto.</p>

<p>Quizá es un poco irónico que este calendario sea digital, pero creo que lejos de demonizar el Internet, debemos encontrar la manera de habitarlo, la manera de navegar sin disolvernos en la imagen y ser reducidos en el objeto, la manera de recuperar pequeños espacios en los que podamos ser sujetos.</p>

<p>Y ahora, después de todo este tostón, solo me queda desearos que tengáis un muy buen día. Espero que esto haya servido como recordatorio para dejar un poquito el móvil a un lado (me incluyo). Como dice el meme que os dejo, abrir sin querer la cámara frontal y encontrarse a uno mismo absolutamente desprevenido y desde un ángulo bajo y feo es el mejor antídoto contra seguir con el <em>móvil</em> en la mano. Con haber sido, aunque solo sea, un 1% de efectiva que la situación que describe el meme, me conformo.</p>
<br>
<img src="fotos/meme.jpg" alt="">

const today = new Date().getDate();
const cal = document.getElementById('calendar');
let activeDay = null;

function formatDate(day) {
  return `${day} de Diciembre`;
}

for (let i = 1; i <= 24; i++) {
  const door = document.createElement('div');
  door.className = 'door';
  const btn = document.createElement('div');
  btn.className = 'day';
  const span = document.createElement('span');
  span.textContent = i;
  btn.appendChild(span);

  if (i > today) {
    btn.classList.add('locked');
    btn.addEventListener('click', () => {
      openModalMessage("No seas tan impaciente chochoo");
    });
  } else {
    btn.addEventListener('click', () => {
      btn.classList.add('open');
      activeDay = btn;
      setTimeout(() => openModalContent(i), 500);
    });
  }

  door.appendChild(btn);
  cal.appendChild(door);
}

function openModalContent(day) {
  document.getElementById('modalContent').innerHTML =
    `<p style="text-align:left; margin-bottom:20px; font-weight: normal;">${formatDate(day)}</p>` +
    dataHTML[day];
  document.getElementById('modal').style.display = 'block';
}

function openModalMessage(msg) {
  document.getElementById('modalContent').innerHTML = `<p>${msg}</p>`;
  document.getElementById('modal').style.display = 'block';
}

function closeModal() {
  document.getElementById('modal').style.display = 'none';
  if(activeDay) activeDay.classList.remove('open');
  activeDay = null;
}

function startCalendar() {
  document.getElementById('intro').style.display = 'none';
  const loading = document.getElementById('loading');
  loading.style.display = 'flex';
  const box = document.querySelector('.loading-box');
  box.classList.add('fill');

  setTimeout(() => {
    loading.style.display = 'none';
    document.getElementById('calendar').style.display = 'grid';
    box.classList.remove('fill');
  }, 3200);
}

document.getElementById('intro').addEventListener('click', startCalendar);
window.addEventListener('keydown', e => { if(e.key === 'Enter') startCalendar(); });
window.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });
document.getElementById('modal').addEventListener('click', e => { if(e.target.id === 'modal') closeModal(); });
</script>

</body>
</html>
